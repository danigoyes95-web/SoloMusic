document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

isplay: swap;\n  src: url(\"b279337f-4a53-4d66-857d-849046296d9e\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"0304a615-b04c-48de-b43a-6efa1651cfe0\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"39f69448-7f1e-42f0-a02f-2abeae2af717\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"3bc011c8-c4f1-4b9b-8810-32a1d8bd8f52\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #161826;\n  --color-surface: #232532;\n  --color-text: #e9e9ed;\n  --color-accent: #9184d9; /* review round 7 (Barron): the accent moves to\n     the product's blurple — OKLCH hue 289.2, the hue of the app's own Pro\n     accent (#9a8fe0, --om-accent-pro) — at the same lightness the steel\n     accent held (L 0.660, so the documented ratios survive) and chroma\n     in the product blurple's own range (its token sits at C 0.118; the\n     accent takes 0.125, from the old steel's 0.030):\n     the accent now reads as an accent rather than another neutral. */\n  --color-accent-2: #a7a1db; /* the machine-derived stand-in follows: same\n     hue, same L 0.734, chroma at the same 2:3 proportion it held */\n  --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f3f5fe;\n  --color-neutral-200: #e4e7f5;\n  --color-neutral-300: #cfd3e5;\n  --color-neutral-400: #b2b6ca;\n  --color-neutral-500: #9397ab;\n  --color-neutral-600: #75798c;\n  --color-neutral-700: #595d6c;\n  --color-neutral-800: #3f424d;\n  --color-neutral-900: #292b31;\n\n  --color-accent-100: #f5f4ff;\n  --color-accent-200: #e7e5fe;\n  --color-accent-300: #d2cefd;\n  --color-accent-400: #b5abfc;\n  --color-accent-500: #968ae0;\n  --color-accent-600: #796cbf;\n  --color-accent-700: #5d5294;\n  --color-accent-800: #423a6a;\n  --color-accent-900: #2b2741;\n\n  --color-accent-2-100: #f5f4ff;\n  --color-accent-2-200: #e7e5fe;\n  --color-accent-2-300: #d2cefd;\n  --color-accent-2-400: #b5afe8;\n  --color-accent-2-500: #9690c9;\n  --color-accent-2-600: #7972a9;\n  --color-accent-2-700: #5c5783;\n  --color-accent-2-800: #423e5d;\n  --color-accent-2-900: #2b293a;\n\n  /* Deck section-divider ground — review round 3: saturation as presence.\n     Dividers take a saturated deep indigo (hue 277, the neutral ramp's own\n     family; C 0.094 — written when the accent held C 0.030, before the\n     round-7 blurple raised it past the ground's) with a lighter bloom and\n     a ghost tint of the same hue, while the slide grounds stay\n     desaturated. Deck-scale fills only — not interface colors. */\n  --color-section: #262a60;\n  --color-section-glow: #353b80;\n  --color-section-ghost: #4c5397;\n\n  --font-heading: \"Inter\", system-ui, sans-serif;\n  --font-heading-weight: 500;\n  --font-body: \"Inter\", system-ui, sans-serif;\n\n  --space-1: 2.8px;\n  --space-2: 5.6px;\n  --space-3: 8.4px;\n  --space-4: 11.2px;\n  --space-6: 16.8px;\n  --space-8: 22.4px;\n\n  --radius-sm: 4px;\n  --radius-md: 8px;\n  --radius-lg: 14px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 0 0 1px #3f424d;\n  --shadow-md: 0 0 0 1px #595d6c, 0 6px 18px rgba(0,0,0,0.55);\n  --shadow-lg: 0 0 0 1px #9397ab, 0 16px 40px rgba(0,0,0,0.65);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.lighten{mix-blend-mode:lighten;background-color:transparent}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n/* Rules fade to transparent at both ends instead of stopping cleanly — a\n   Nocturne signature. The ramp is 48px an end (one deck baseline unit),\n   painted from the same divider token. Freestanding rules fade; box\n   outlines, in-control separators, and short accent marks stay solid. */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: linear-gradient(to right,\n    transparent, var(--color-divider) 48px,\n    var(--color-divider) calc(100% - 48px), transparent);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { color: var(--color-accent); border-color: var(--color-accent); }\n.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }\n.btn-primary:active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-800); color: var(--color-accent-100); }\n.tag-accent-2 { background: var(--color-accent-2-800); color: var(--color-accent-2-100); }\n.tag-neutral { background: var(--color-neutral-800); color: var(--color-neutral-100); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid transparent; /* keeps layout; the row paints the fading rule */\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid transparent;\n}\n/* Row rules as row-level strips so the end-fade spans the row, not each cell. */\n.table thead tr {\n  background: linear-gradient(to right,\n    transparent, var(--color-divider) 48px,\n    var(--color-divider) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n.table tbody tr {\n  background: linear-gradient(to right,\n    transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,\n    color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n.table tbody tr:hover {\n  /* the hover tint layers over the row rule, which keeps painting */\n  background:\n    linear-gradient(color-mix(in srgb, var(--color-text) 4%, transparent),\n                    color-mix(in srgb, var(--color-text) 4%, transparent)) no-repeat 0 0 / 100% 100%,\n    linear-gradient(to right,\n      transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,\n      color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<style>\n  body { margin: 0; background: var(--color-bg); }\n  a { color: var(--color-accent-300); text-decoration: none; }\n  a:hover { color: var(--color-accent); }\n  @keyframes djGrain { 0%,100% { opacity: .5 } 50% { opacity: .85 } }\n  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }\n<\u002Fstyle>\n<script>\n  window.JS_ANALYTICS = { ga4: \"G-XXXXXXXXXX\", pixel: \"XXXXXXXXXXXXXXX\" };\n  (function () {\n    var c = window.JS_ANALYTICS;\n    if (c.ga4.indexOf(\"X\") === -1) {\n      var s = document.createElement(\"script\");\n      s.async = true; s.src = \"https://www.googletagmanager.com/gtag/js?id=\" + c.ga4;\n      document.head.appendChild(s);\n      window.dataLayer = window.dataLayer || [];\n      window.gtag = function () { window.dataLayer.push(arguments); };\n      gtag(\"js\", new Date()); gtag(\"config\", c.ga4);\n    }\n    if (c.pixel.indexOf(\"X\") === -1 && !window.fbq) {\n      var n = window.fbq = function () { n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments); };\n      n.queue = []; n.loaded = true; n.version = \"2.0\";\n      var t = document.createElement(\"script\");\n      t.async = true; t.src = \"https://connect.facebook.net/en_US/fbevents.js\";\n      document.head.appendChild(t);\n      fbq(\"init\", c.pixel); fbq(\"track\", \"PageView\");\n    }\n  })();\n<\u002Fscript>\n<\u002Fhelmet>\n\n<div style=\"background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); font-size: 16px; line-height: 1.6; overflow-x: hidden; padding-bottom: 70px\">\n\n  <header style=\"position: sticky; top: 0; z-index: 40; display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); padding: var(--space-3) var(--space-6); background: color-mix(in srgb, var(--color-bg) 90%, transparent); backdrop-filter: blur(12px)\">\n    <a href=\"#top\" style=\"display: flex; align-items: baseline; gap: var(--space-3); color: var(--color-text)\">\n      <span style=\"font-family: var(--font-heading); font-weight: 500; font-size: 15px; letter-spacing: .3em\">JUAN JOSÉ<\u002Fspan>\n      <span style=\"font-size: 10px; letter-spacing: .26em; color: var(--color-neutral-500)\">PRESS KIT<\u002Fspan>\n    <\u002Fa>\n    <nav style=\"display: flex; align-items: center; gap: var(--space-6)\">\n      <a href=\"#bio\" style=\"font-size: 13px; letter-spacing: .06em; color: var(--color-neutral-300)\" style-hover=\"color: var(--color-text)\">BIO<\u002Fa>\n      <a href=\"#rider\" style=\"font-size: 13px; letter-spacing: .06em; color: var(--color-neutral-300)\" style-hover=\"color: var(--color-text)\">RIDER<\u002Fa>\n      <a href=\"#booking\" class=\"btn btn-primary\" style=\"white-space: nowrap\">Booking<\u002Fa>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <section id=\"top\" style=\"position: relative; min-height: 92vh; display: grid; align-items: end; padding: calc(var(--space-8) * 3) var(--space-6) calc(var(--space-8) * 2); isolation: isolate\">\n    <div class=\"lighten\" style=\"position: absolute; inset: 0; z-index: -2\">\n      <img src=\"918b82ba-fc05-4d67-8088-e87a7d4e9cc0\" alt=\"Juan José en cabina bajo luz cian\" style=\"width: 100%; height: 100%; object-fit: cover; object-position: center 40%\">\n    <\u002Fdiv>\n    <div style=\"position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, color-mix(in srgb, var(--color-bg) 78%, transparent) 0%, color-mix(in srgb, var(--color-bg) 30%, transparent) 45%, var(--color-bg) 94%)\"><\u002Fdiv>\n\n    <div style=\"max-width: 1180px; width: 100%; margin: 0 auto; display: grid; gap: var(--space-6)\">\n      <span style=\"font-size: 12px; letter-spacing: .34em; color: #35E8FF; text-shadow: 0 0 16px rgba(53,232,255,.6)\">HOUSE MUSIC · AMBATO, ECUADOR<\u002Fspan>\n      <h1 style=\"font-family: var(--font-heading); font-weight: 500; font-size: clamp(52px, 13vw, 168px); line-height: .88; letter-spacing: -.045em; margin: 0; text-shadow: 0 0 60px rgba(53,232,255,.28)\">Juan José<\u002Fh1>\n      <p style=\"margin: 0; max-width: 40ch; font-size: clamp(18px, 2vw, 23px); color: var(--color-neutral-200); text-wrap: pretty\">Busca sonidos house en todo el mundo y los trae a la cabina. Lee el ambiente y decide si la noche va de energía o de calma.<\u002Fp>\n      <div style=\"display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; margin-top: var(--space-3)\">\n        <a href=\"{{ mixLink }}\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ track }}\" data-cta=\"hero-mix\" class=\"btn btn-primary\" style=\"font-size: 16px; padding: var(--space-4) var(--space-8)\">Escuchar un set<\u002Fa>\n        <a href=\"{{ waLink }}\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ track }}\" data-cta=\"hero-booking\" class=\"btn btn-secondary\" style=\"font-size: 16px; padding: var(--space-4) var(--space-8)\">Contratar por WhatsApp<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--space-6); margin-top: var(--space-6); padding-top: var(--space-6); background: linear-gradient(to right, transparent, var(--color-divider) 48px, var(--color-divider) calc(100% - 48px), transparent) no-repeat top / 100% 1px\">\n        <div>\n          <div style=\"font-family: var(--font-heading); font-size: 13px; letter-spacing: .14em; color: var(--color-neutral-500)\">GÉNERO<\u002Fdiv>\n          <div style=\"margin-top: var(--space-2); font-size: 16px\">House<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family: var(--font-heading); font-size: 13px; letter-spacing: .14em; color: var(--color-neutral-500)\">BASE<\u002Fdiv>\n          <div style=\"margin-top: var(--space-2); font-size: 16px\">Ambato, EC<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family: var(--font-heading); font-size: 13px; letter-spacing: .14em; color: var(--color-neutral-500)\">SETS<\u002Fdiv>\n          <div style=\"margin-top: var(--space-2); font-size: 16px\">Club · rooftop · festival<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family: var(--font-heading); font-size: 13px; letter-spacing: .14em; color: var(--color-neutral-500)\">CONTACTO<\u002Fdiv>\n          <div style=\"margin-top: var(--space-2); font-size: 16px\"><a href=\"{{ waLink }}\" target=\"_blank\" rel=\"noopener\">+593 99 513 7063<\u002Fa><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding: calc(var(--space-8) * 2) var(--space-6); background: var(--color-bg); background-image: linear-gradient(180deg, var(--color-bg), color-mix(in srgb, var(--color-section) 55%, var(--color-bg)) 45%, var(--color-bg))\">\n    <div style=\"max-width: 1180px; margin: 0 auto; display: grid; gap: var(--space-8)\">\n      <span style=\"font-size: 12px; letter-spacing: .3em; color: var(--color-accent-200)\">HA SONADO EN<\u002Fspan>\n      <div style=\"display: flex; flex-wrap: wrap; gap: var(--space-4) var(--space-8)\">\n        <span style=\"font-family: var(--font-heading); font-size: clamp(19px, 2.4vw, 30px); font-weight: 500; color: #fff\">DNTD Miami<\u002Fspan>\n        <span style=\"font-family: var(--font-heading); font-size: clamp(19px, 2.4vw, 30px); font-weight: 500; color: #fff\">Aquelarre Music<\u002Fspan>\n        <span style=\"font-family: var(--font-heading); font-size: clamp(19px, 2.4vw, 30px); font-weight: 500; color: #fff\">NH Festival<\u002Fspan>\n        <span style=\"font-family: var(--font-heading); font-size: clamp(19px, 2.4vw, 30px); font-weight: 500; color: #fff\">GAD Ambato<\u002Fspan>\n        <span style=\"font-family: var(--font-heading); font-size: clamp(19px, 2.4vw, 30px); font-weight: 500; color: #fff\">M-Sessions<\u002Fspan>\n        <span style=\"font-family: var(--font-heading); font-size: clamp(19px, 2.4vw, 30px); font-weight: 500; color: #fff\">No Limits Event<\u002Fspan>\n        <span style=\"font-family: var(--font-heading); font-size: clamp(19px, 2.4vw, 30px); font-weight: 500; color: #fff\">Social Entertainment<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin: 0; font-size: 15px; color: var(--color-accent-200)\">New York · New Jersey · Quito · Ambato · Baños<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"escucha\" style=\"padding: calc(var(--space-8) * 2.5) var(--space-6)\">\n    <div style=\"max-width: 1180px; margin: 0 auto; display: grid; gap: var(--space-8)\">\n      <div style=\"display: grid; gap: var(--space-3); max-width: 60ch\">\n        <span style=\"font-size: 12px; letter-spacing: .3em; color: #35E8FF; text-shadow: 0 0 14px rgba(53,232,255,.55)\">ESCUCHA<\u002Fspan>\n        <h2 style=\"font-family: var(--font-heading); font-weight: 500; font-size: clamp(28px, 3.6vw, 44px); line-height: 1.08; margin: 0; letter-spacing: -.02em\">Antes de leer nada más, pon un set.<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: var(--space-4)\">\n        <a href=\"{{ mixLink }}\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ track }}\" data-cta=\"set-1\" class=\"card\" style=\"gap: var(--space-3); color: var(--color-text); padding: var(--space-6); border: 1px solid #35E8FF; box-shadow: 0 0 0 1px rgba(53,232,255,.25), 0 0 18px rgba(53,232,255,.35), inset 0 0 22px rgba(53,232,255,.08); transition: box-shadow .25s ease\" style-hover=\"box-shadow: 0 0 0 1px rgba(53,232,255,.5), 0 0 30px rgba(53,232,255,.6), inset 0 0 26px rgba(53,232,255,.14); color: var(--color-text)\">\n          <span class=\"card-kicker\">SET 01<\u002Fspan>\n          <span class=\"card-title\">Rooftop · Ambato<\u002Fspan>\n          <span class=\"card-body\">House melódico para atardecer. Lo que suena cuando la pista recién se llena.<\u002Fspan>\n          <span class=\"card-meta\">Escuchar →<\u002Fspan>\n        <\u002Fa>\n        <a href=\"{{ mixLink }}\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ track }}\" data-cta=\"set-2\" class=\"card\" style=\"gap: var(--space-3); color: var(--color-text); padding: var(--space-6); border: 1px solid #35E8FF; box-shadow: 0 0 0 1px rgba(53,232,255,.25), 0 0 18px rgba(53,232,255,.35), inset 0 0 22px rgba(53,232,255,.08); transition: box-shadow .25s ease\" style-hover=\"box-shadow: 0 0 0 1px rgba(53,232,255,.5), 0 0 30px rgba(53,232,255,.6), inset 0 0 26px rgba(53,232,255,.14); color: var(--color-text)\">\n          <span class=\"card-kicker\">SET 02<\u002Fspan>\n          <span class=\"card-title\">Club · peak time<\u002Fspan>\n          <span class=\"card-body\">Tech house y groove sostenido. Para cuando la noche ya no necesita explicaciones.<\u002Fspan>\n          <span class=\"card-meta\">Escuchar →<\u002Fspan>\n        <\u002Fa>\n        <a href=\"{{ mixLink }}\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ track }}\" data-cta=\"set-3\" class=\"card\" style=\"gap: var(--space-3); color: var(--color-text); padding: var(--space-6); border: 1px solid #35E8FF; box-shadow: 0 0 0 1px rgba(53,232,255,.25), 0 0 18px rgba(53,232,255,.35), inset 0 0 22px rgba(53,232,255,.08); transition: box-shadow .25s ease\" style-hover=\"box-shadow: 0 0 0 1px rgba(53,232,255,.5), 0 0 30px rgba(53,232,255,.6), inset 0 0 26px rgba(53,232,255,.14); color: var(--color-text)\">\n          <span class=\"card-kicker\">SET 03<\u002Fspan>\n          <span class=\"card-title\">Open format house<\u002Fspan>\n          <span class=\"card-body\">Apertura larga, lectura de público y subida progresiva sin romper el ambiente.<\u002Fspan>\n          <span class=\"card-meta\">Escuchar →<\u002Fspan>\n        <\u002Fa>\n      <\u002Fdiv>\n      <p style=\"margin: 0; font-size: 13px; color: var(--color-neutral-500)\">Los tres enlaces apuntan al mismo perfil hasta que pases los links de SoundCloud o Mixcloud de cada set.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"bio\" style=\"padding: calc(var(--space-8) * 2) var(--space-6) calc(var(--space-8) * 2.5)\">\n    <div style=\"max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: calc(var(--space-8) * 2); align-items: start\">\n      <div style=\"display: grid; gap: var(--space-6)\">\n        <span style=\"font-size: 12px; letter-spacing: .3em; color: #35E8FF; text-shadow: 0 0 14px rgba(53,232,255,.55)\">BIOGRAFÍA<\u002Fspan>\n        <p style=\"margin: 0; font-size: clamp(18px, 1.9vw, 21px); line-height: 1.5; color: var(--color-neutral-100); text-wrap: pretty\">Juan José, experimentado DJ de música House, un derivado de la electrónica, residente de la ciudad de Ambato ECUADOR. Dedicado a buscar nuevos sonidos House alrededor del mundo, para que sean transmitidos a personas que se encuentran buscando una nueva experiencia con la música.<\u002Fp>\n        <p style=\"margin: 0; color: var(--color-neutral-300); text-wrap: pretty\">Capaz de crear ambientes con vibes llenas de energía o relajantes según lo que el momento y el público decida, todo dentro del área de House Music. La determinación para conectar con los ambientes y públicos, han permitido crear atmósferas llenas de buenas vibes en New York, New Jersey, Ambato, Baños, Quito y llegado a distintas organizaciones como DNTD MIAMI (domingo no tan domingo), Aquelarre Músic, NH Festival, GAD AMBATO, M-Sessions, No Limits Event, Social Entertaiment.<\u002Fp>\n        <div style=\"display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center\">\n          <button type=\"button\" sc-camel-on-click=\"{{ copiarBio }}\" class=\"btn btn-secondary\" style=\"cursor: pointer\">{{ labelCopiar }}<\u002Fbutton>\n          <span style=\"font-size: 13px; color: var(--color-neutral-500)\">Para pegarla en el flyer o la nota de prensa.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <figure st te de la ciudad de Ambato ECUADOR. Dedicado a buscar nuevos sonidos House alrededor del mundo, para que sean transmitidos a personas que se encuentran buscando una nueva experiencia con la música. Capaz de crear ambientes con vibes llenas de energía o relajantes según lo que el momento y el público decida todo dentro del área de House Music. La determinación para conectar con los ambientes y públicos, han permitido crear atmósferas llenas de buenas vibes en New York, New Jersey, Ambato, Baños, Quito y llegado a distintas organizaciones como DNTD MIAMI (domingo no tan domingo), Aquelarre Músic, NH Festival, GAD AMBATO, M-Sessions, No Limits Event, Social Entertaiment.\";\n\n  track = (e) => {\n    const origen = e.currentTarget.getAttribute(\"data-cta\") || \"cta\";\n    if (window.gtag) window.gtag(\"event\", \"cta_presskit\", { origen });\n    if (window.fbq) window.fbq(\"track\", \"Contact\", { origen });\n    if (window.dataLayer) window.dataLayer.push({ event: \"cta_presskit\", origen });\n  };\n\n  copiarBio = () => {\n    const done = () => {\n      this.setState({ copiado: true });\n      setTimeout(() => this.setState({ copiado: false }), 2200);\n    };\n    if (navigator.clipboard) navigator.clipboard.writeText(this.bio).then(done, done);\n    else done();\n  };\n\n  renderVals() {\n    const numero = (this.props.whatsapp ?? \"593995137063\").replace(/[^0-9]/g, \"\");\n    const mensaje = encodeURIComponent(\n      this.props.mensajeWhatsapp ?? \"Hola Juan José, vi tu press kit. Quiero cotizar una fecha. Ciudad:  · Fecha:  · Tipo de evento: \"\n    );\n    return {\n      waLink: \"https://wa.me/\" + numero + \"?text=\" + mensaje,\n      mixLink: this.props.mixLink ?? \"https://instagram.com/J_U_A_N_S_O_L_O_99\",\n      labelCopiar: this.state.copiado ? \"Bio copiada ✓\" : \"Copiar bio\",\n      copiarBio: this.copiarBio,\n      track: this.track\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
